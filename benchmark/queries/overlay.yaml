  xscope-ow2-abstain:
    answerable: false               # OW2 has no published PDF; known corpus hole
    expected_governs: none
    governing_article: null
    category: [cross_scope, abstention, routing]

  xscope-forfeit-grace-abstain:
    answerable: false               # Global has no punctuality rule; it lives in title books
    expected_governs: none
