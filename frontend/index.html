<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>EWC Rulebook RAG</title>
  <script>
    // Set the theme before first paint so the page never flashes the wrong
    // ground. Reads the same key the ui slice writes.
    try {
      var t = localStorage.getItem('ewc.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { /* private mode: fall through to prefers-color-scheme */ }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
